<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D 自由空間座標與平面沙盒</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    :root {
      --bg-base: #0f172a; --bg-panel: #162032; --bg-card: #0f172a;
      --border: #2d3b55; --accent: #3b82f6; --text-main: #f8fafc;
      --text-muted: #94a3b8; --btn-bg: #1e293b; --input-bg: #162032;
    }
    body.light-theme {
      --bg-base: #f8fafc; --bg-panel: #ffffff; --bg-card: #f1f5f9;
      --border: #cbd5e1; --accent: #2563eb; --text-main: #0f172a;
      --text-muted: #475569; --btn-bg: #e2e8f0; --input-bg: #ffffff;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; }
    body { margin: 0; background: var(--bg-base); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { padding: 10px 16px; background: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    header a { color: var(--text-muted); text-decoration: none; font-size: 13px; font-weight: 600; white-space: nowrap; }
    header h1 { font-size: 14px; margin: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .header-actions { display: flex; gap: 6px; }
    .hdr-btn { background: var(--btn-bg); border: 1px solid var(--border); color: var(--text-main); padding: 5px 10px; border-radius: 5px; font-size: 12px; cursor: pointer; font-weight: 600; white-space: nowrap; }
    #btn-mobile-toggle { display: none; }

    #main { display: flex; flex: 1; flex-direction: row; overflow: hidden; }
    #canvas-container { flex: 1.45; position: relative; cursor: grab; touch-action: none; }
    #hint-badge { position: absolute; bottom: 12px; left: 12px; background: var(--bg-panel); opacity: 0.92; padding: 5px 10px; border-radius: 5px; font-size: 11px; color: var(--text-muted); pointer-events: none; border: 1px solid var(--border); }

    #panel { flex: 1; max-width: 440px; background: var(--bg-panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
    .panel-top { padding: 12px 14px 0 14px; border-bottom: 1px solid var(--border); background: var(--bg-panel); }
    .cam-bar { display: flex; gap: 6px; margin-bottom: 10px; }
    .cam-bar button { flex: 1; }
    .tabs { display: flex; gap: 4px; }
    .tab-btn {
      flex: 1; padding: 9px 8px; border: none; background: transparent; color: var(--text-muted);
      font-size: 13px; font-weight: 700; cursor: pointer; border-bottom: 2px solid transparent;
    }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

    .tab-content { flex: 1; overflow-y: auto; padding: 14px; display: none; flex-direction: column; gap: 10px; }
    .tab-content.active { display: flex; }

    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
    .card h2 { font-size: 12px; letter-spacing: 0.04em; margin: 0 0 8px 0; color: var(--accent); font-weight: 700; display: flex; justify-content: space-between; align-items: center; }

    .input-row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; }
    input[type="number"], input[type="text"], select {
      background: var(--input-bg); border: 1px solid var(--border); color: var(--text-main);
      padding: 6px 8px; border-radius: 5px; font-size: 13px;
    }
    input[type="number"] { width: 52px; text-align: center; }
    input.name-in { width: 44px; text-align: center; }
    select { min-width: 72px; }

    button.ctrl { background: var(--btn-bg); color: var(--text-main); border: 1px solid var(--border); padding: 7px 10px; border-radius: 5px; font-size: 12px; font-weight: 600; cursor: pointer; }
    button.ctrl.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.ctrl.danger { color: #ef4444; border-color: rgba(239, 68, 68, 0.35); }

    .obj-list { display: flex; flex-direction: column; gap: 8px; }
    .obj-item { display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); padding: 10px 12px; border-radius: 8px; font-size: 13px; border: 1px solid var(--border); gap: 8px; }
    .obj-sub { display: block; font-size: 11.5px; color: var(--text-muted); margin-top: 3px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .del-btn { background: var(--btn-bg); border: 1px solid var(--border); color: var(--text-muted); cursor: pointer; font-size: 11.5px; padding: 4px 8px; border-radius: 4px; }
    .del-btn:hover { color: #ef4444; border-color: #ef4444; }

    @media (max-width: 768px) {
      #btn-mobile-toggle { display: inline-block; }
      #main { flex-direction: column; }
      #canvas-container { flex: 1; }
      #panel { max-width: 100%; flex: 1.15; border-left: none; border-top: 1px solid var(--border); }
      #panel.collapsed { display: none; }
    }
  </style>
</head>
<body>
<header>
  <a href="../index.html">← 目錄</a>
  <h1>自由空間座標與平面沙盒</h1>
  <div class="header-actions">
    <button id="btn-theme" class="hdr-btn">淺色模式</button>
    <button id="btn-mobile-toggle" class="hdr-btn">隱藏面板</button>
  </div>
</header>

<div id="main">
  <div id="canvas-container">
    <div id="hint-badge">紅軸 X · 綠軸 Y · 藍軸 Z（單指旋轉 · 雙指縮放）</div>
  </div>

  <div id="panel">
    <div class="panel-top">
      <div class="cam-bar">
        <button id="btn-reset-cam" class="ctrl">重設 3D 視角</button>
        <button id="btn-top-cam" class="ctrl">俯視 xy 水平面</button>
        <button id="btn-clear" class="ctrl danger">清空畫布</button>
      </div>
      <div class="tabs">
        <button class="tab-btn active" data-tab="tab-build">+ 建立空間物件</button>
        <button class="tab-btn" data-tab="tab-list">已建物件與算式 (<span id="obj-count">0</span>)</button>
      </div>
    </div>

    <div id="tab-build" class="tab-content active">
      <div class="card">
        <h2>1. 新增空間點 $P(x, y, z)$</h2>
        <div class="input-row">
          <input id="pt-name" class="name-in" type="text" value="A" maxlength="4" />
          <span>(</span>
          <input id="pt-x" type="number" value="2" step="1" />
          <input id="pt-y" type="number" value="2" step="1" />
          <input id="pt-z" type="number" value="4" step="1" />
          <span>)</span>
          <button id="btn-add-pt" class="ctrl primary">加入點</button>
        </div>
      </div>

      <div class="card">
        <h2>2. 兩點幾何構造（線段 / 直線 / 向量）</h2>
        <div class="input-row">
          <select id="sel-p1"></select>
          <span>至</span>
          <select id="sel-p2"></select>
          <select id="sel-line-type">
            <option value="seg">兩點線段</option>
            <option value="line">延伸直線</option>
            <option value="vec">有向向量 AB</option>
          </select>
          <button id="btn-add-line" class="ctrl primary">建立</button>
        </div>
      </div>

      <div class="card">
        <h2>3. 新增原點空間向量 $\vec{v} = (a, b, c)$</h2>
        <div class="input-row">
          <span>$\vec{v} =$ (</span>
          <input id="vec-x" type="number" value="3" step="1" />
          <input id="vec-y" type="number" value="-2" step="1" />
          <input id="vec-z" type="number" value="2" step="1" />
          <span>)</span>
          <button id="btn-add-vec" class="ctrl primary">加入向量</button>
        </div>
      </div>

      <div class="card">
        <h2>4. 新增空間平面 $ax + by + cz = d$</h2>
        <div class="input-row" style="font-size: 12.5px;">
          <input id="pl-a" type="number" value="1" step="1" style="width:42px;" /><span>$x +$</span>
          <input id="pl-b" type="number" value="1" step="1" style="width:42px;" /><span>$y +$</span>
          <input id="pl-c" type="number" value="1" step="1" style="width:42px;" /><span>$z =$</span>
          <input id="pl-d" type="number" value="4" step="1" style="width:42px;" />
          <button id="btn-add-pl" class="ctrl primary">繪製平面</button>
        </div>
      </div>
    </div>

    <div id="tab-list" class="tab-content">
      <div class="obj-list" id="obj-list"></div>
    </div>
  </div>
</div>

<script>
  const katexOpts = { delimiters: [{left: "$$", right: "$$", display: true}, {left: "$", right: "$", display: false}] };
  renderMathInElement(document.body, katexOpts);

  // 雙主題專屬高對比色票（黑底用高明度亮色、白底用高飽和深色）
  const THEME_PALETTE = {
    dark: {
      axes: { x: '#f87171', y: '#34d399', z: '#60a5fa' },
      gridMain: 0x64748b, gridSub: 0x26334d,
      items: ['#60a5fa', '#34d399', '#fbbf24', '#f472b6', '#a78bfa', '#22d3ee'],
      labelTxt: '#f8fafc', dashLine: 0x94a3b8, planeOpacity: 0.34
    },
    light: {
      axes: { x: '#dc2626', y: '#059669', z: '#2563eb' },
      gridMain: 0x64748b, gridSub: 0xcbd5e1,
      items: ['#1d4ed8', '#047857', '#d97706', '#be185d', '#6d28d9', '#0e7490'],
      labelTxt: '#0f172a', dashLine: 0x475569, planeOpacity: 0.38
    }
  };
  let isLightMode = false;
  function getTheme() { return isLightMode ? THEME_PALETTE.light : THEME_PALETTE.dark; }

  function switchTab(tabId) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tabId));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === tabId));
  }
  document.querySelectorAll('.tab-btn').forEach(btn => { btn.onclick = () => switchTab(btn.dataset.tab); });

  const toggleBtn = document.getElementById('btn-mobile-toggle');
  const panelEl = document.getElementById('panel');
  toggleBtn.onclick = () => {
    panelEl.classList.toggle('collapsed');
    toggleBtn.textContent = panelEl.classList.contains('collapsed') ? '顯示面板' : '隱藏面板';
    window.dispatchEvent(new Event('resize'));
  };

  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, container.clientWidth / container.clientHeight, 0.1, 100);
  const camDef = new THREE.Vector3(12.5, 6.2, 11.0);
  const camTop = new THREE.Vector3(0.01, 16, 0.01);
  camera.position.copy(camDef);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  let targetCamPos = null;
  function smoothMoveTo(posVec) { targetCamPos = posVec.clone(); }
  controls.addEventListener('start', () => { targetCamPos = null; });

  function m2w(x, y, z) { return new THREE.Vector3(y, z, x); }

  let gridHelper = new THREE.GridHelper(12, 12, getTheme().gridMain, getTheme().gridSub);
  scene.add(gridHelper);

  // 可動態換色的粗體三軸
  const axisObjects = [];
  function createSpriteLabel(text, colorHex, fontSize = 36, w = 64, h = 64) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d'); ctx.fillStyle = colorHex; ctx.font = `bold ${fontSize}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, w / 2, h / 2);
    return new THREE.CanvasTexture(c);
  }

  function makeThickAxis(axisKey, endVec, labelTxt, labelPos) {
    const col = getTheme().axes[axisKey];
    const len = endVec.length();
    const mat = new THREE.MeshBasicMaterial({ color: col });
    const cylGeo = new THREE.CylinderGeometry(0.035, 0.035, len, 12);
    cylGeo.translate(0, len / 2, 0);
    const cyl = new THREE.Mesh(cylGeo, mat);
    cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), endVec.clone().normalize());
    scene.add(cyl);

    const cone = new THREE.Mesh(new THREE.ConeGeometry(0.115, 0.34, 16), mat);
    cone.position.copy(endVec); cone.quaternion.copy(cyl.quaternion);
    scene.add(cone);

    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: createSpriteLabel(labelTxt, col, 38), transparent: true }));
    sp.position.copy(labelPos); sp.scale.set(0.85, 0.85, 0.85);
    scene.add(sp);

    axisObjects.push({ axisKey, mat, sp, labelTxt });
  }
  makeThickAxis('x', new THREE.Vector3(0, 0, 6.2), 'X', new THREE.Vector3(0, 0.35, 6.7));
  makeThickAxis('y', new THREE.Vector3(6.2, 0, 0), 'Y', new THREE.Vector3(6.7, 0.35, 0));
  makeThickAxis('z', new THREE.Vector3(0, 6.2, 0), 'Z', new THREE.Vector3(0, 6.7, 0));

  const userObjects = [];
  let colorCounter = 0;

  function syncPointSelectors() {
    const pts = userObjects.filter(o => o.type === 'point');
    const s1 = document.getElementById('sel-p1');
    const s2 = document.getElementById('sel-p2');
    s1.innerHTML = ''; s2.innerHTML = '';
    pts.forEach((p, idx) => { s1.add(new Option(p.name, idx)); s2.add(new Option(p.name, idx)); });
    if (pts.length >= 2) s2.selectedIndex = 1;
  }

  function renderObjList() {
    const listEl = document.getElementById('obj-list');
    document.getElementById('obj-count').textContent = userObjects.length;
    listEl.innerHTML = '';
    if (userObjects.length === 0) {
      listEl.innerHTML = '<div style="color:var(--text-muted); font-size:13px; text-align:center; padding:24px 0;">目前畫布為空，請切換至「+ 建立空間物件」新增</div>';
    }
    const palette = getTheme().items;
    userObjects.forEach((item, idx) => {
      const hex = palette[item.colorIdx % palette.length];
      const row = document.createElement('div');
      row.className = 'obj-item';
      row.innerHTML = `
        <div>
          <span><strong style="color:${hex};">●</strong> ${item.label}</span>
          ${item.sub ? `<span class="obj-sub">${item.sub}</span>` : ''}
        </div>
        <button class="del-btn" data-idx="${idx}">移除</button>
      `;
      listEl.appendChild(row);
    });
    listEl.querySelectorAll('.del-btn').forEach(btn => {
      btn.onclick = () => {
        const i = Number(btn.dataset.idx);
        scene.remove(userObjects[i].group);
        userObjects.splice(i, 1);
        renderObjList();
        syncPointSelectors();
      };
    });
    syncPointSelectors();
  }

  function addPoint(name, x, y, z, autoSwitch = true) {
    const cIdx = colorCounter++;
    const col = getTheme().items[cIdx % 6];
    const g = new THREE.Group();
    const pos = m2w(x, y, z);

    const dotMat = new THREE.MeshBasicMaterial({ color: col });
    const dot = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 16), dotMat);
    dot.position.copy(pos); g.add(dot);

    const dashMat = new THREE.LineDashedMaterial({ color: getTheme().dashLine, dashSize: 0.2, gapSize: 0.12 });
    const dash = new THREE.Line(new THREE.BufferGeometry().setFromPoints([pos, m2w(x, y, 0)]), dashMat);
    dash.computeLineDistances(); g.add(dash);

    const textStr = `${name}(${x},${y},${z})`;
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: createSpriteLabel(textStr, getTheme().labelTxt, 28, 256, 64), transparent: true }));
    sp.position.copy(pos).add(new THREE.Vector3(0, 0.45, 0)); sp.scale.set(2.4, 0.6, 1); g.add(sp);

    scene.add(g);
    userObjects.push({
      type: 'point', name, coords: [x, y, z], colorIdx: cIdx, sprite: sp, textStr,
      materials: [dotMat], dashMat,
      label: `點 ${name}(${x}, ${y}, ${z})`, sub: `至 xy 平面高度 |z| = ${Math.abs(z)}`, group: g
    });
    renderObjList();
    if (autoSwitch) switchTab('tab-list');
  }

  function addLineBetweenPoints(autoSwitch = true) {
    const pts = userObjects.filter(o => o.type === 'point');
    if (pts.length < 2) return;
    const p1 = pts[Number(document.getElementById('sel-p1').value)];
    const p2 = pts[Number(document.getElementById('sel-p2').value)];
    if (!p1 || !p2 || p1 === p2) return;

    const mode = document.getElementById('sel-line-type').value;
    const [x1, y1, z1] = p1.coords;
    const [x2, y2, z2] = p2.coords;
    const dx = x2 - x1, dy = y2 - y1, dz = z2 - z1;
    const dist = Math.round(Math.hypot(dx, dy, dz) * 100) / 100;

    const w1 = m2w(x1, y1, z1);
    const w2 = m2w(x2, y2, z2);
    const cIdx = colorCounter++;
    const col = getTheme().items[cIdx % 6];
    const g = new THREE.Group();
    const mats = [];
    let arrowObj = null;

    let titlePrefix = '線段';
    if (mode === 'seg') {
      const m = new THREE.LineBasicMaterial({ color: col });
      g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([w1, w2]), m));
      mats.push(m);
    } else if (mode === 'line') {
      titlePrefix = '直線';
      const m = new THREE.LineBasicMaterial({ color: col });
      const dir = new THREE.Vector3().subVectors(w2, w1).normalize();
      const mid = new THREE.Vector3().addVectors(w1, w2).multiplyScalar(0.5);
      g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([mid.clone().addScaledVector(dir, -9), mid.clone().addScaledVector(dir, 9)]), m));
      mats.push(m);
    } else {
      titlePrefix = '向量';
      const vecW = new THREE.Vector3().subVectors(w2, w1);
      arrowObj = new THREE.ArrowHelper(vecW.clone().normalize(), w1, vecW.length(), col, 0.4, 0.24);
      g.add(arrowObj);
    }

    scene.add(g);
    userObjects.push({
      type: 'line', colorIdx: cIdx, materials: mats, arrowObj,
      label: `${titlePrefix} ${p1.name}${p2.name}`,
      sub: `方向分量 (${dx}, ${dy}, ${dz}) · 長度 = ${dist}`, group: g
    });
    renderObjList();
    if (autoSwitch) switchTab('tab-list');
  }

  function addVector(a, b, c) {
    const end = m2w(a, b, c);
    const len = end.length();
    if (len < 0.01) return;
    const cIdx = colorCounter++;
    const col = getTheme().items[cIdx % 6];
    const g = new THREE.Group();
    const normVal = Math.round(Math.hypot(a, b, c) * 100) / 100;
    const arrowObj = new THREE.ArrowHelper(end.clone().normalize(), new THREE.Vector3(0,0,0), len, col, 0.4, 0.25);
    g.add(arrowObj);
    scene.add(g);
    userObjects.push({
      type: 'vector', colorIdx: cIdx, arrowObj,
      label: `向量 v = (${a}, ${b}, ${c})`, sub: `向量長度 |v| = √(${a*a+b*b+c*c}) ≈ ${normVal}`, group: g
    });
    renderObjList();
    switchTab('tab-list');
  }

  function addPlane(a, b, c, d, autoSwitch = true) {
    const normalMath = new THREE.Vector3(a, b, c);
    if (normalMath.length() < 0.001) return;
    const cIdx = colorCounter++;
    const col = getTheme().items[cIdx % 6];
    const g = new THREE.Group();

    const nW = m2w(a, b, c);
    const nUnit = nW.clone().normalize();
    const distFromOrigin = d / nW.length();
    const centerOnPlane = nUnit.clone().multiplyScalar(distFromOrigin);

    const planeGeo = new THREE.PlaneGeometry(8, 8);
    const meshMat = new THREE.MeshBasicMaterial({ color: col, side: THREE.DoubleSide, transparent: true, opacity: getTheme().planeOpacity });
    const mesh = new THREE.Mesh(planeGeo, meshMat);
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), nUnit);
    mesh.position.copy(centerOnPlane);
    g.add(mesh);

    const edgeMat = new THREE.LineBasicMaterial({ color: col });
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(planeGeo), edgeMat);
    edges.quaternion.copy(mesh.quaternion);
    edges.position.copy(centerOnPlane);
    g.add(edges);

    const arrowObj = new THREE.ArrowHelper(nUnit, centerOnPlane, 2.5, col, 0.38, 0.24);
    g.add(arrowObj);
    scene.add(g);
    userObjects.push({
      type: 'plane', colorIdx: cIdx, materials: [meshMat, edgeMat], meshMat, arrowObj,
      label: `平面 ${a}x + ${b}y + ${c}z = ${d}`, sub: `法向量 n = (${a}, ${b}, ${c})`, group: g
    });
    renderObjList();
    if (autoSwitch) switchTab('tab-list');
  }

  // 一鍵動態切換深淺色全套 3D 色票
  function applyThemeTo3D() {
    const th = getTheme();
    scene.remove(gridHelper);
    gridHelper = new THREE.GridHelper(12, 12, th.gridMain, th.gridSub);
    scene.add(gridHelper);

    axisObjects.forEach(ax => {
      const c = th.axes[ax.axisKey];
      ax.mat.color.set(c);
      ax.sp.material.map.dispose();
      ax.sp.material.map = createSpriteLabel(ax.labelTxt, c, 38);
      ax.sp.material.needsUpdate = true;
    });

    userObjects.forEach(obj => {
      const hex = th.items[obj.colorIdx % 6];
      if (obj.materials) obj.materials.forEach(m => m.color.set(hex));
      if (obj.meshMat) obj.meshMat.opacity = th.planeOpacity;
      if (obj.arrowObj) obj.arrowObj.setColor(new THREE.Color(hex));
      if (obj.dashMat) obj.dashMat.color.setHex(th.dashLine);
      if (obj.type === 'point' && obj.sprite) {
        obj.sprite.material.map.dispose();
        obj.sprite.material.map = createSpriteLabel(obj.textStr, th.labelTxt, 28, 256, 64);
        obj.sprite.material.needsUpdate = true;
      }
    });
    renderObjList();
  }

  function clearAll() {
    userObjects.forEach(item => scene.remove(item.group));
    userObjects.length = 0;
    colorCounter = 0;
    renderObjList();
    switchTab('tab-build');
  }

  document.getElementById('btn-clear').onclick = clearAll;
  document.getElementById('btn-reset-cam').onclick = () => smoothMoveTo(camDef);
  document.getElementById('btn-top-cam').onclick = () => smoothMoveTo(camTop);
  document.getElementById('btn-add-pt').onclick = () => {
    addPoint(document.getElementById('pt-name').value || 'P', Number(document.getElementById('pt-x').value), Number(document.getElementById('pt-y').value), Number(document.getElementById('pt-z').value));
  };
  document.getElementById('btn-add-line').onclick = () => addLineBetweenPoints(true);
  document.getElementById('btn-add-vec').onclick = () => {
    addVector(Number(document.getElementById('vec-x').value), Number(document.getElementById('vec-y').value), Number(document.getElementById('vec-z').value));
  };
  document.getElementById('btn-add-pl').onclick = () => {
    addPlane(Number(document.getElementById('pl-a').value), Number(document.getElementById('pl-b').value), Number(document.getElementById('pl-c').value), Number(document.getElementById('pl-d').value));
  };

  document.getElementById('btn-theme').onclick = (e) => {
    isLightMode = !isLightMode;
    document.body.classList.toggle('light-theme', isLightMode);
    e.target.textContent = isLightMode ? '深色模式' : '淺色模式';
    applyThemeTo3D();
  };

  addPlane(1, 1, 1, 4, false);
  addPoint('P', 3, 3, 4, false);
  addPoint('H', 1, 1, 2, false);
  addLineBetweenPoints(false);
  switchTab('tab-build');

  function animate() {
    requestAnimationFrame(animate);
    if (targetCamPos) {
      camera.position.lerp(targetCamPos, 0.08);
      controls.target.lerp(new THREE.Vector3(0, 0, 0), 0.08);
      if (camera.position.distanceTo(targetCamPos) < 0.05) targetCamPos = null;
    }
    controls.update();
    renderer.render(scene, camera);
  }
  animate();
  window.addEventListener('resize', () => {
    if (!container.clientWidth || !container.clientHeight) return;
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });
</script>
</body>
</html>
