<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D 互動檢視｜兩平面二面角與法向量</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="../assets/auth.js"></script>
  <script src="../assets/theme.js"></script>
  <style>
    :root { --bg-base: #0f172a; --bg-panel: #162032; --bg-card: #0f172a; --border: #2d3b55; --accent: #3b82f6; --text-main: #f8fafc; --text-muted: #94a3b8; --text-body: #cbd5e1; --btn-bg: #1e293b; }
    body.light-theme { --bg-base: #f8fafc; --bg-panel: #ffffff; --bg-card: #f1f5f9; --border: #cbd5e1; --accent: #2563eb; --text-main: #0f172a; --text-muted: #475569; --text-body: #1e293b; --btn-bg: #e2e8f0; }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; }
    body { margin: 0; background: var(--bg-base); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { padding: 10px 16px; background: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    header a { color: var(--text-muted); text-decoration: none; font-size: 13px; font-weight: 600; }
    header h1 { font-size: 14px; margin: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .header-actions { display: flex; gap: 6px; }
    .hdr-btn { background: var(--btn-bg); border: 1px solid var(--border); color: var(--text-main); padding: 5px 10px; border-radius: 5px; font-size: 12px; cursor: pointer; font-weight: 600; }
    #btn-mobile-toggle { display: none; }
    #main { display: flex; flex: 1; flex-direction: row; overflow: hidden; }
    #canvas-container { flex: 1.45; position: relative; cursor: grab; touch-action: none; }
    #hint-badge { position: absolute; bottom: 12px; left: 12px; background: var(--bg-panel); opacity: 0.9; padding: 5px 10px; border-radius: 5px; font-size: 11px; color: var(--text-muted); pointer-events: none; border: 1px solid var(--border); }
    #panel { flex: 1; max-width: 430px; background: var(--bg-panel); border-left: 1px solid var(--border); padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
    .card h2 { font-size: 12px; letter-spacing: 0.06em; margin: 0 0 8px 0; color: var(--accent); font-weight: 700; }
    .card p, .card li { font-size: 13.5px; line-height: 1.65; color: var(--text-body); margin: 4px 0; }
    .card strong { color: var(--text-main); }
    .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button.ctrl { background: var(--btn-bg); color: var(--text-main); border: 1px solid var(--border); padding: 8px 10px; border-radius: 6px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
    button.ctrl.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .slider-box { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 13px; }
    .angle-readout { margin-top: 8px; padding: 8px 10px; border-radius: 6px; background: var(--bg-panel); border: 1px solid var(--border); font-size: 12.5px; display: flex; justify-content: space-between; }
    input[type="range"] { width: 100%; accent-color: var(--accent); margin-top: 6px; }
    @media (max-width: 768px) {
      #btn-mobile-toggle { display: inline-block; }
      #main { flex-direction: column; }
      #canvas-container { flex: 1; }
      #panel { max-width: 100%; flex: 1.1; border-left: none; border-top: 1px solid var(--border); }
      #panel.collapsed { display: none; }
    }
  </style>
</head>
<body>
<header>
  <a href="../index.html">← 目錄</a>
  <h1 id="header-title">載入中...</h1>
  <div class="header-actions">
    <button id="btn-theme" class="hdr-btn">淺色模式</button>
    <button id="btn-mobile-toggle" class="hdr-btn">隱藏解析</button>
  </div>
</header>

<div id="main">
  <div id="canvas-container">
    <div id="hint-badge">單指拖曳旋轉 · 反轉法向量觀察「相等 vs. 互補」</div>
  </div>
  <div id="panel">
    <div class="card">
      <h2>題目敘述與角度即時驗證</h2>
      <p id="q-text"></p>
      <div class="slider-box">
        <div id="latex-theta"></div>
        <input type="range" id="slider-angle" min="30" max="150" step="10" value="60" />
        <div class="angle-readout">
          <span id="readout-dih"></span>
          <span id="readout-norm" style="color: var(--accent); font-weight: 700;"></span>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>法向量反轉與交線側視運鏡</h2>
      <div class="btn-group">
        <button id="btn-flip" class="ctrl primary">反轉法向量 n2 方向</button>
        <button id="btn-side" class="ctrl">平滑切換「交線側視」</button>
      </div>
    </div>

    <div class="card">
      <h2>核心解題直覺（3 步判別法）</h2>
      <ol id="steps-list" style="padding-left: 18px; margin: 0;"></ol>
    </div>
  </div>
</div>

<script>
  const katexOpts = { delimiters: [{left: "$$", right: "$$", display: true}, {left: "$", right: "$", display: false}] };
  const urlParams = new URLSearchParams(window.location.search);
  const probId = urlParams.get('id') || 'vec-04';

  const toggleBtn = document.getElementById('btn-mobile-toggle');
  const panelEl = document.getElementById('panel');
  toggleBtn.onclick = () => {
    panelEl.classList.toggle('collapsed');
    toggleBtn.textContent = panelEl.classList.contains('collapsed') ? '顯示解析' : '隱藏解析';
    window.dispatchEvent(new Event('resize'));
  };

  let thetaDeg = 60;
  let isFlipped = false;

  function updateAngleReadout() {
    const phiDeg = isFlipped ? thetaDeg : (180 - thetaDeg);
    const tEl = document.getElementById('latex-theta');
    const dEl = document.getElementById('readout-dih');
    const nEl = document.getElementById('readout-norm');
    tEl.innerHTML = `設定兩平面二面角 $\\theta = ${thetaDeg}^\\circ$（${isFlipped ? '法向量一進一出' : '兩法向量皆朝外'}）`;
    dEl.innerHTML = `二面角 $\\theta = ${thetaDeg}^\\circ$`;
    nEl.innerHTML = `法向量夾角 $\\phi = ${phiDeg}^\\circ$`;
    if (window.renderMathInElement) { renderMathInElement(tEl, katexOpts); renderMathInElement(dEl, katexOpts); renderMathInElement(nEl, katexOpts); }
  }

  fetch('../data/space-vector.json?v=' + Date.now()).then(r => r.json()).then(data => {
    const prob = data.problems.find(p => p.id === probId) || data.problems[4];
    if (typeof enforcePageLock === "function") enforcePageLock(prob.locked);
    document.getElementById('header-title').textContent = `${prob.num}. ${prob.title}`;
    document.getElementById('q-text').innerHTML = prob.questionLatex;
    thetaDeg = (prob.params && prob.params.angle) ? prob.params.angle : 60;
    document.getElementById('slider-angle').value = thetaDeg;
    const ol = document.getElementById('steps-list');
    prob.steps.forEach(s => { const li = document.createElement('li'); li.innerHTML = s; ol.appendChild(li); });
    updateAngleReadout();
    syncGeometry();
    renderMathInElement(document.body, katexOpts);
  });

  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, container.clientWidth / container.clientHeight, 0.1, 100);
  const camDef = new THREE.Vector3(7.5, 5.5, 9.5), camSide = new THREE.Vector3(0, 1.2, 11.5);
  camera.position.copy(camDef);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  let targetCamPos = null;
  function smoothMoveTo(posVec) { targetCamPos = posVec.clone(); }
  controls.addEventListener('start', () => { targetCamPos = null; });

  const th0 = getVisualTheme();
  // 交線 L 沿 Z 軸
  const lineLMat = new THREE.LineBasicMaterial({ color: th0.highlight });
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, -4), new THREE.Vector3(0, 0, 4)]), lineLMat));

  // 平面 E1 (固定水平向右延伸 x >= 0)
  const p1Geo = new THREE.PlaneGeometry(4.5, 6); p1Geo.rotateX(-Math.PI / 2); p1Geo.translate(2.25, 0, 0);
  const p1Mat = new THREE.MeshBasicMaterial({ color: th0.plane, side: THREE.DoubleSide, transparent: true, opacity: th0.planeOpacity });
  const p1EdgeMat = new THREE.LineBasicMaterial({ color: th0.planeEdge });
  scene.add(new THREE.Mesh(p1Geo, p1Mat));
  scene.add(new THREE.LineSegments(new THREE.EdgesGeometry(p1Geo), p1EdgeMat));

  // 平面 E2 (可繞 Z 軸旋轉)
  const p2Pivot = new THREE.Group();
  const p2Geo = new THREE.PlaneGeometry(4.5, 6); p2Geo.rotateX(-Math.PI / 2); p2Geo.translate(2.25, 0, 0);
  const p2Mat = new THREE.MeshBasicMaterial({ color: th0.secondary, side: THREE.DoubleSide, transparent: true, opacity: th0.planeOpacity });
  const p2EdgeMat = new THREE.LineBasicMaterial({ color: th0.secondary });
  p2Pivot.add(new THREE.Mesh(p2Geo, p2Mat));
  p2Pivot.add(new THREE.LineSegments(new THREE.EdgesGeometry(p2Geo), p2EdgeMat));
  scene.add(p2Pivot);

  // 法向量 n1 (固定朝下，朝向外側) 與 n2 (朝向上外側，可反轉)
  const arrowN1 = new THREE.ArrowHelper(new THREE.Vector3(0, -1, 0), new THREE.Vector3(2.2, 0, 0), 2.8, th0.planeEdge, 0.35, 0.22);
  const arrowN2 = new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(2.2, 0, 0), 2.8, th0.primary, 0.35, 0.22);
  scene.add(arrowN1);
  p2Pivot.add(arrowN2);

  const sprites = [
    makeThemeSprite('E1', 'textAccent', new THREE.Vector3(4.2, -0.35, 2.5), [1.1, 0.5, 1]),
    makeThemeSprite('n1', 'textAccent', new THREE.Vector3(2.2, -3.1, 0), [1.1, 0.5, 1]),
    makeThemeSprite('交線 L', 'textHighlight', new THREE.Vector3(0, 0.35, 3.8), [1.6, 0.5, 1])
  ];
  sprites.forEach(sp => scene.add(sp));

  function syncGeometry() {
    const rad = THREE.MathUtils.degToRad(thetaDeg);
    p2Pivot.rotation.z = rad;
    arrowN2.setDirection(new THREE.Vector3(0, isFlipped ? -1 : 1, 0));
  }

  document.getElementById('slider-angle').addEventListener('input', e => {
    thetaDeg = Number(e.target.value);
    updateAngleReadout();
    syncGeometry();
  });
  document.getElementById('btn-flip').onclick = () => {
    isFlipped = !isFlipped;
    updateAngleReadout();
    syncGeometry();
  };

  let isSide = false;
  document.getElementById('btn-side').onclick = () => {
    isSide = !isSide;
    smoothMoveTo(isSide ? camSide : camDef);
  };

  document.getElementById('btn-theme').onclick = (e) => {
    const isL = document.body.classList.toggle('light-theme');
    e.target.textContent = isL ? '深色模式' : '淺色模式';
    const th = getVisualTheme();
    lineLMat.color.setHex(th.highlight);
    p1Mat.color.setHex(th.plane); p1Mat.opacity = th.planeOpacity; p1EdgeMat.color.setHex(th.planeEdge);
    p2Mat.color.setHex(th.secondary); p2Mat.opacity = th.planeOpacity; p2EdgeMat.color.setHex(th.secondary);
    arrowN1.setColor(new THREE.Color(th.planeEdge)); arrowN2.setColor(new THREE.Color(th.primary));
    sprites.forEach(refreshSpriteTexture);
  };

  function animate() {
    requestAnimationFrame(animate);
    if (targetCamPos) { camera.position.lerp(targetCamPos, 0.08); if (camera.position.distanceTo(targetCamPos) < 0.05) targetCamPos = null; }
    controls.update(); renderer.render(scene, camera);
  }
  animate();
  window.addEventListener('resize', () => {
    if (!container.clientWidth || !container.clientHeight) return;
    camera.aspect = container.clientWidth / container.clientHeight; camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });
</script>
</body>
</html>
