<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D 互動檢視｜正立方體截面</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="../assets/auth.js"></script>
  <style>
    :root {
      --bg-base: #0b0f19;
      --bg-panel: #131a2a;
      --bg-card: #0b0f19;
      --border: #243049;
      --accent: #3b82f6;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-body: #cbd5e1;
      --btn-bg: #1e293b;
    }
    body.light-theme {
      --bg-base: #f8fafc;
      --bg-panel: #ffffff;
      --bg-card: #f1f5f9;
      --border: #cbd5e1;
      --accent: #2563eb;
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-body: #1e293b;
      --btn-bg: #e2e8f0;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; }
    body { margin: 0; background: var(--bg-base); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; transition: background 0.25s, color 0.25s; }
    header { padding: 10px 16px; background: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    header a { color: var(--text-muted); text-decoration: none; font-size: 13px; font-weight: 600; white-space: nowrap; }
    header h1 { font-size: 14px; margin: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .header-actions { display: flex; gap: 6px; }
    .hdr-btn { background: var(--btn-bg); border: 1px solid var(--border); color: var(--text-main); padding: 5px 10px; border-radius: 5px; font-size: 12px; cursor: pointer; white-space: nowrap; font-weight: 600; }
    #btn-mobile-toggle { display: none; }

    #main { display: flex; flex: 1; flex-direction: row; overflow: hidden; }
    #canvas-container { flex: 1.45; position: relative; cursor: grab; touch-action: none; }
    #canvas-container:active { cursor: grabbing; }
    #hint-badge { position: absolute; bottom: 12px; left: 12px; background: var(--bg-panel); opacity: 0.88; padding: 5px 10px; border-radius: 5px; font-size: 11px; color: var(--text-muted); pointer-events: none; border: 1px solid var(--border); }

    #panel { flex: 1; max-width: 430px; background: var(--bg-panel); border-left: 1px solid var(--border); padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
    .card h2 { font-size: 12px; letter-spacing: 0.06em; margin: 0 0 8px 0; color: var(--accent); font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
    .card p { font-size: 13.5px; line-height: 1.65; color: var(--text-body); margin: 4px 0; }
    .card strong { color: var(--text-main); }

    /* 逐步拆解步驟控制器 */
    .stepper-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--bg-panel); padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); margin-bottom: 8px; }
    .step-indicator { font-size: 12.5px; font-weight: 700; color: var(--accent); }
    .step-btns { display: flex; gap: 6px; }
    button.ctrl { background: var(--btn-bg); color: var(--text-main); border: 1px solid var(--border); padding: 7px 11px; border-radius: 6px; font-size: 12.5px; font-weight: 600; cursor: pointer; transition: 0.15s; }
    button.ctrl:disabled { opacity: 0.4; cursor: not-allowed; }
    button.ctrl.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    /* 步驟列表同步高亮 */
    ol.steps { padding-left: 18px; margin: 0; display: flex; flex-direction: column; gap: 8px; }
    ol.steps li { font-size: 13px; line-height: 1.6; color: var(--text-muted); padding: 6px 8px; border-radius: 6px; border-left: 2px solid transparent; transition: 0.2s; }
    ol.steps li.active-step { color: var(--text-body); background: rgba(59, 130, 246, 0.08); border-left-color: var(--accent); }

    .slider-box { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
    .slider-header { display: flex; justify-content: space-between; align-items: center; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }

    @media (max-width: 768px) {
      #btn-mobile-toggle { display: inline-block; }
      #main { flex-direction: column; }
      #canvas-container { flex: 1; }
      #panel { max-width: 100%; flex: 1.1; border-left: none; border-top: 1px solid var(--border); }
      #panel.collapsed { display: none; }
    }
  </style>
</head>
<body>
<header>
  <a href="../index.html">← 目錄</a>
  <h1 id="header-title">載入中...</h1>
  <div class="header-actions">
    <button id="btn-theme" class="hdr-btn">淺色模式</button>
    <button id="btn-mobile-toggle" class="hdr-btn">隱藏解析</button>
  </div>
</header>

<div id="main">
  <div id="canvas-container">
    <div id="hint-badge">單指拖曳旋轉 · 雙指縮放</div>
  </div>
  <div id="panel">
    <div class="card">
      <h2>題目敘述與參數聯動</h2>
      <p id="q-text"></p>
      <div class="slider-box">
        <div class="slider-header">
          <span id="latex-side"></span>
          <span id="latex-ans" style="color: var(--accent); font-weight: 600;"></span>
        </div>
        <input type="range" id="slider-side" min="3" max="15" step="3" value="6" />
      </div>
    </div>

    <div class="card">
      <h2>平滑運鏡與視角控制</h2>
      <div class="btn-group">
        <button id="btn-perp" class="ctrl primary">平滑切換正交垂直視角</button>
        <button id="btn-reset" class="ctrl">重設預設 3D 視角</button>
      </div>
    </div>

    <div class="card">
      <h2>逐步拆解構造（Step-by-Step）</h2>
      <div class="stepper-bar">
        <span class="step-indicator" id="step-label">步驟 1 / 3：顯示等腰對稱稜邊</span>
        <div class="step-btns">
          <button id="btn-prev" class="ctrl" disabled>上一步</button>
          <button id="btn-next" class="ctrl primary">下一步</button>
        </div>
      </div>
      <ol id="steps-list" class="steps"></ol>
    </div>
  </div>
</div>

<script>
  const katexOpts = { delimiters: [{left: "$$", right: "$$", display: true}, {left: "$", right: "$", display: false}] };
  const urlParams = new URLSearchParams(window.location.search);
  const probId = urlParams.get('id') || 'vec-01';

  // 手機版收合切換
  const toggleBtn = document.getElementById('btn-mobile-toggle');
  const panelEl = document.getElementById('panel');
  toggleBtn.onclick = () => {
    panelEl.classList.toggle('collapsed');
    toggleBtn.textContent = panelEl.classList.contains('collapsed') ? '顯示解析' : '隱藏解析';
    window.dispatchEvent(new Event('resize'));
  };

  function fmtCoef(num, root) {
    return num === 1 ? `\\sqrt{${root}}` : `${num}\\sqrt{${root}}`;
  }

  function updateSideUI(a) {
    const sideEl = document.getElementById('latex-side');
    const ansEl = document.getElementById('latex-ans');
    sideEl.innerHTML = `設定邊長 $a = ${a}$`;
    ansEl.innerHTML = `距離 $h = \\frac{\\sqrt{3}}{3}a = ${fmtCoef(a / 3, 3)}$`;
    if (window.renderMathInElement) {
      renderMathInElement(sideEl, katexOpts);
      renderMathInElement(ansEl, katexOpts);
    }
  }

  fetch('../data/space-vector.json?v=' + Date.now()).then(r => r.json()).then(data => {
    const prob = data.problems.find(p => p.id === probId) || data.problems[0];
    if (typeof enforcePageLock === "function") enforcePageLock(prob.locked);
    document.getElementById('header-title').textContent = `${prob.num}. ${prob.title}`;
    document.getElementById('q-text').innerHTML = prob.questionLatex;
    const initSide = prob.params.side || 6;
    document.getElementById('slider-side').value = initSide;

    const ol = document.getElementById('steps-list');
    prob.steps.forEach((s, idx) => {
      const li = document.createElement('li');
      li.innerHTML = s;
      if (idx === 0) li.classList.add('active-step');
      ol.appendChild(li);
    });

    updateSideUI(initSide);
    renderMathInElement(document.body, katexOpts);
  });

  document.getElementById('slider-side').addEventListener('input', e => updateSideUI(Number(e.target.value)));

  // Three.js 場景設定
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, container.clientWidth / container.clientHeight, 0.1, 100);
  const camDef = new THREE.Vector3(9.5, 7.5, 10.5);
  const camPerp = new THREE.Vector3(11, -5.5, 0);
  camera.position.copy(camDef);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;

  // 平滑運鏡系統 (Camera Tweening)
  let targetCamPos = null;
  let targetLookAt = new THREE.Vector3(0, 0, 0);
  function smoothMoveTo(posVec) {
    targetCamPos = posVec.clone();
  }
  controls.addEventListener('start', () => { targetCamPos = null; }); // 使用者手動拖曳時立即釋放控制權

  const s = 2.8;
  const pts = {
    A: new THREE.Vector3(-s, s, s), B: new THREE.Vector3(s, s, s), C: new THREE.Vector3(s, s, -s), D: new THREE.Vector3(-s, s, -s),
    E: new THREE.Vector3(-s, -s, s), F: new THREE.Vector3(s, -s, s), G: new THREE.Vector3(s, -s, -s), H: new THREE.Vector3(-s, -s, -s)
  };

  const boxMat = new THREE.LineBasicMaterial({ color: 0x475569 });
  scene.add(new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(s*2, s*2, s*2)), boxMat));

  // Step 1 元素：等腰稜邊 A-B, A-D, A-E
  const step1Group = new THREE.Group();
  const dashMat = new THREE.LineDashedMaterial({ color: 0xeab308, dashSize: 0.2, gapSize: 0.12 });
  [pts.B, pts.D, pts.E].forEach(t => {
    const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints([pts.A, t]), dashMat);
    l.computeLineDistances(); step1Group.add(l);
  });
  scene.add(step1Group);

  // Step 2 元素：截面 BDE
  const step2Group = new THREE.Group();
  step2Group.visible = false;
  const triGeo = new THREE.BufferGeometry().setFromPoints([pts.B, pts.D, pts.E]);
  step2Group.add(new THREE.Mesh(triGeo, new THREE.MeshBasicMaterial({ color: 0x3b82f6, side: THREE.DoubleSide, transparent: true, opacity: 0.35 })));
  step2Group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([pts.B, pts.D, pts.E, pts.B]), new THREE.LineBasicMaterial({ color: 0x60a5fa })));
  scene.add(step2Group);

  // Step 3 元素：體對角線 AG 與垂足 P
  const step3Group = new THREE.Group();
  step3Group.visible = false;
  step3Group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([pts.A, pts.G]), new THREE.LineBasicMaterial({ color: 0xf97316 })));
  const centerP = new THREE.Vector3().add(pts.B).add(pts.D).add(pts.E).divideScalar(3);
  const dotP = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 16), new THREE.MeshBasicMaterial({ color: 0xfacc15 }));
  dotP.position.copy(centerP);
  step3Group.add(dotP);
  scene.add(step3Group);

  // 頂點標籤（支援深淺主題動態重繪）
  const labelSprites = [];
  function buildLabels(isLight) {
    labelSprites.forEach(sp => scene.remove(sp));
    labelSprites.length = 0;
    Object.entries(pts).forEach(([k, v]) => {
      const isKey = ['A', 'B', 'D', 'E', 'G'].includes(k);
      const c = document.createElement('canvas'); c.width = 128; c.height = 128;
      const ctx = c.getContext('2d');
      ctx.fillStyle = isKey ? (isLight ? '#0f172a' : '#f8fafc') : (isLight ? '#94a3b8' : '#64748b');
      ctx.font = isKey ? '700 46px -apple-system, sans-serif' : '400 38px -apple-system, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(k, 64, 64);
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
      sp.position.copy(v).multiplyScalar(1.13);
      sp.scale.set(0.95, 0.95, 0.95);
      scene.add(sp);
      labelSprites.push(sp);
    });
  }
  buildLabels(false);

  // 逐步拆解狀態機 (Step 1 ~ 3)
  let currentStep = 1;
  const stepNames = [
    "步驟 1 / 3：觀察等腰對稱稜邊",
    "步驟 2 / 3：顯示正三角形截面 BDE",
    "步驟 3 / 3：體對角線 AG 垂直貫穿"
  ];
  function syncStepUI() {
    step1Group.visible = currentStep >= 1;
    step2Group.visible = currentStep >= 2;
    step3Group.visible = currentStep >= 3;
    document.getElementById('step-label').textContent = stepNames[currentStep - 1];
    document.getElementById('btn-prev').disabled = currentStep === 1;
    document.getElementById('btn-next').disabled = currentStep === 3;
    document.querySelectorAll('#steps-list li').forEach((li, idx) => {
      li.classList.toggle('active-step', idx === currentStep - 1);
    });
  }
  document.getElementById('btn-prev').onclick = () => { if (currentStep > 1) { currentStep--; syncStepUI(); } };
  document.getElementById('btn-next').onclick = () => { if (currentStep < 3) { currentStep++; syncStepUI(); } };

  // 視角與主題控制
  let isPerp = false;
  document.getElementById('btn-perp').onclick = () => {
    isPerp = !isPerp;
    smoothMoveTo(isPerp ? camPerp : camDef);
    // 若還沒按到第 3 步就切換正交視角，自動展開全部構造方便觀察垂直
    if (isPerp && currentStep < 3) { currentStep = 3; syncStepUI(); }
  };
  document.getElementById('btn-reset').onclick = () => { isPerp = false; smoothMoveTo(camDef); };

  let isLight = false;
  document.getElementById('btn-theme').onclick = (e) => {
    isLight = !isLight;
    document.body.classList.toggle('light-theme', isLight);
    e.target.textContent = isLight ? '深色模式' : '淺色模式';
    boxMat.color.setHex(isLight ? 0x94a3b8 : 0x475569);
    buildLabels(isLight);
  };

  function animate() {
    requestAnimationFrame(animate);
    if (targetCamPos) {
      camera.position.lerp(targetCamPos, 0.08);
      controls.target.lerp(targetLookAt, 0.08);
      if (camera.position.distanceTo(targetCamPos) < 0.05) targetCamPos = null;
    }
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    if (!container.clientWidth || !container.clientHeight) return;
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });
</script>
</body>
</html>
