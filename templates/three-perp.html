<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D 互動檢視｜三垂線定理</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    :root { --bg-base: #0b0f19; --bg-panel: #131a2a; --border: #243049; --accent: #3b82f6; --text-main: #f1f5f9; --text-muted: #94a3b8; }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; }
    body { margin: 0; background: var(--bg-base); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { padding: 10px 16px; background: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    header a { color: var(--text-muted); text-decoration: none; font-size: 13px; font-weight: 600; }
    header h1 { font-size: 14px; margin: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #btn-mobile-toggle { display: none; background: #1e293b; border: 1px solid var(--border); color: var(--text-main); padding: 5px 10px; border-radius: 5px; font-size: 12px; cursor: pointer; }
    #main { display: flex; flex: 1; flex-direction: row; overflow: hidden; }
    #canvas-container { flex: 1.45; position: relative; cursor: grab; touch-action: none; }
    #hint-badge { position: absolute; bottom: 12px; left: 12px; background: rgba(11, 15, 25, 0.75); padding: 5px 10px; border-radius: 5px; font-size: 11px; color: var(--text-muted); pointer-events: none; border: 1px solid var(--border); }
    #panel { flex: 1; max-width: 420px; background: var(--bg-panel); border-left: 1px solid var(--border); padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .card { background: var(--bg-base); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
    .card h2 { font-size: 12px; letter-spacing: 0.06em; margin: 0 0 8px 0; color: var(--accent); font-weight: 700; }
    .card p, .card li { font-size: 13.5px; line-height: 1.65; color: #cbd5e1; margin: 4px 0; }
    .card strong { color: var(--text-main); }
    .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button.ctrl { background: #1e293b; color: var(--text-main); border: 1px solid var(--border); padding: 9px 10px; border-radius: 6px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
    button.ctrl.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .slider-box { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 13px; }
    input[type="range"] { width: 100%; accent-color: var(--accent); margin-top: 6px; }
    @media (max-width: 768px) {
      #btn-mobile-toggle { display: inline-block; }
      #main { flex-direction: column; }
      #canvas-container { flex: 1; }
      #panel { max-width: 100%; flex: 1.05; border-left: none; border-top: 1px solid var(--border); }
      #panel.collapsed { display: none; }
    }
  </style>
</head>
<body>
<header>
  <a href="../index.html">← 目錄</a>
  <h1 id="header-title">載入中...</h1>
  <button id="btn-mobile-toggle">隱藏解析</button>
</header>

<div id="main">
  <div id="canvas-container">
    <div id="hint-badge">單指拖曳旋轉 · 觀察三個空間直角</div>
  </div>
  <div id="panel">
    <div class="card">
      <h2>題目敘述與動態驗證</h2>
      <p id="q-text"></p>
      <div class="slider-box">
        <div id="latex-bc"></div>
        <input type="range" id="slider-c" min="2" max="12" step="1" value="12" />
      </div>
    </div>
    <div class="card">
      <h2>視角與輔助面控制</h2>
      <div class="btn-group">
        <button id="btn-top" class="ctrl primary">切換正上方俯視地板</button>
        <button id="btn-reset" class="ctrl">重設預設 3D 視角</button>
        <button id="btn-plane" class="ctrl">顯示 / 隱藏斜平面 PBC</button>
      </div>
    </div>
    <div class="card">
      <h2>核心解題直覺（3 步拆解）</h2>
      <ol id="steps-list" style="padding-left: 18px; margin: 0;"></ol>
    </div>
  </div>
</div>

<script>
  const katexOpts = { delimiters: [{left: "$$", right: "$$", display: true}, {left: "$", right: "$", display: false}] };
  const urlParams = new URLSearchParams(window.location.search);
  const probId = urlParams.get('id') || 'vec-02';

  const toggleBtn = document.getElementById('btn-mobile-toggle');
  const panelEl = document.getElementById('panel');
  toggleBtn.onclick = () => {
    panelEl.classList.toggle('collapsed');
    toggleBtn.textContent = panelEl.classList.contains('collapsed') ? '顯示解析' : '隱藏解析';
    window.dispatchEvent(new Event('resize'));
  };

  function updateBCUI(bc) {
    const pc = Math.round(Math.sqrt(25 + bc * bc) * 10) / 10;
    const el = document.getElementById('latex-bc');
    el.innerHTML = `移動 $C$ 點位置：$BC = ${bc} \\Rightarrow PC = \\sqrt{5^2 + ${bc}^2} \\approx ${pc}$`;
    renderMathInElement(el, katexOpts);
  }

  fetch('../data/space-vector.json?v=' + Date.now()).then(r => r.json()).then(data => {
    const prob = data.problems.find(p => p.id === probId) || data.problems[1];
    document.getElementById('header-title').textContent = `${prob.num || '02'}. ${prob.title}`;
    document.getElementById('q-text').innerHTML = prob.questionLatex;
    const ol = document.getElementById('steps-list');
    prob.steps.forEach(s => { const li = document.createElement('li'); li.innerHTML = s; ol.appendChild(li); });
    updateBCUI(12);
    renderMathInElement(document.body, katexOpts);
  });

  // Three.js 場景
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, container.clientWidth / container.clientHeight, 0.1, 100);
  const camDef = [9, 6.8, 10], camTop = [0, 14, 0.1];
  camera.position.set(...camDef);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  const floor = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), new THREE.MeshBasicMaterial({ color: 0x131a2a, side: THREE.DoubleSide, transparent: true, opacity: 0.85 }));
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);
  scene.add(new THREE.GridHelper(12, 12, 0x243049, 0x172033));

  const A = new THREE.Vector3(-2, 0, -1), P = new THREE.Vector3(-2, 4, -1), B = new THREE.Vector3(1, 0, -1);
  const C = new THREE.Vector3(1, 0, 4);

  function addLine(p1, p2, color) {
    const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints([p1, p2]), new THREE.LineBasicMaterial({ color }));
    scene.add(l); return l;
  }
  addLine(new THREE.Vector3(1, 0, -4.5), new THREE.Vector3(1, 0, 5.2), 0x64748b);
  addLine(P, A, 0x3b82f6);
  addLine(A, B, 0x10b981);
  addLine(P, B, 0xeab308);
  const linePC = addLine(P, C, 0xf97316);

  // B點直角記號
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(1, 0, -0.45), new THREE.Vector3(0.65, 0.45, -0.45), new THREE.Vector3(0.65, 0.45, -1)
  ]), new THREE.LineBasicMaterial({ color: 0xeab308 })));

  const pbcGeo = new THREE.BufferGeometry().setFromPoints([P, B, C]);
  const pbcMesh = new THREE.Mesh(pbcGeo, new THREE.MeshBasicMaterial({ color: 0xeab308, side: THREE.DoubleSide, transparent: true, opacity: 0.22 }));
  scene.add(pbcMesh);

  function makeLabel(txt, pos, col) {
    const c = document.createElement('canvas'); c.width = 128; c.height = 128;
    const ctx = c.getContext('2d'); ctx.fillStyle = col; ctx.font = '600 48px -apple-system, sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(txt, 64, 64);
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
    sp.position.copy(pos).add(new THREE.Vector3(0, 0.5, 0)); sp.scale.set(0.95, 0.95, 0.95); scene.add(sp);
    return sp;
  }
  makeLabel('P', P, '#60a5fa'); makeLabel('A', A, '#f8fafc'); makeLabel('B', B, '#facc15');
  const labelC = makeLabel('C', C, '#fb923c');

  // 滑桿即時移動 3D 空間中的 C 點
  document.getElementById('slider-c').addEventListener('input', e => {
    const bcVal = Number(e.target.value);
    updateBCUI(bcVal);
    C.z = -1 + (bcVal / 12) * 5;
    linePC.geometry.setFromPoints([P, C]);
    pbcGeo.setFromPoints([P, B, C]);
    labelC.position.copy(C).add(new THREE.Vector3(0, 0.5, 0));
  });

  let isTop = false;
  document.getElementById('btn-top').onclick = () => { isTop = !isTop; camera.position.set(...(isTop ? camTop : camDef)); controls.target.set(0,0,0); };
  document.getElementById('btn-reset').onclick = () => { isTop = false; camera.position.set(...camDef); controls.target.set(0,0,0); };
  document.getElementById('btn-plane').onclick = () => { pbcMesh.visible = !pbcMesh.visible; };

  function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
  animate();
  window.addEventListener('resize', () => {
    if (!container.clientWidth || !container.clientHeight) return;
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });
</script>
</body>
</html>
