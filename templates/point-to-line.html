<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D 互動檢視｜點到空間直線距離與垂足</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="../assets/auth.js"></script>
  <script src="../assets/theme.js"></script>
  <style>
    :root { --bg-base: #0f172a; --bg-panel: #162032; --bg-card: #0f172a; --border: #2d3b55; --accent: #3b82f6; --text-main: #f8fafc; --text-muted: #94a3b8; --text-body: #cbd5e1; --btn-bg: #1e293b; }
    body.light-theme { --bg-base: #f8fafc; --bg-panel: #ffffff; --bg-card: #f1f5f9; --border: #cbd5e1; --accent: #2563eb; --text-main: #0f172a; --text-muted: #475569; --text-body: #1e293b; --btn-bg: #e2e8f0; }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; }
    body { margin: 0; background: var(--bg-base); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { padding: 10px 16px; background: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    header a { color: var(--text-muted); text-decoration: none; font-size: 13px; font-weight: 600; }
    header h1 { font-size: 14px; margin: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .header-actions { display: flex; gap: 6px; }
    .hdr-btn { background: var(--btn-bg); border: 1px solid var(--border); color: var(--text-main); padding: 5px 10px; border-radius: 5px; font-size: 12px; cursor: pointer; font-weight: 600; }
    #btn-mobile-toggle { display: none; }
    #main { display: flex; flex: 1; flex-direction: row; overflow: hidden; }
    #canvas-container { flex: 1.45; position: relative; cursor: grab; touch-action: none; }
    #hint-badge { position: absolute; bottom: 12px; left: 12px; background: var(--bg-panel); opacity: 0.9; padding: 5px 10px; border-radius: 5px; font-size: 11px; color: var(--text-muted); pointer-events: none; border: 1px solid var(--border); }
    #panel { flex: 1; max-width: 430px; background: var(--bg-panel); border-left: 1px solid var(--border); padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
    .card h2 { font-size: 12px; letter-spacing: 0.06em; margin: 0 0 8px 0; color: var(--accent); font-weight: 700; }
    .card p { font-size: 13.5px; line-height: 1.65; color: var(--text-body); margin: 4px 0; }
    .card strong { color: var(--text-main); }
    .stepper-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--bg-panel); padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); margin-bottom: 8px; }
    .step-indicator { font-size: 12.5px; font-weight: 700; color: var(--accent); }
    .step-btns { display: flex; gap: 6px; }
    button.ctrl { background: var(--btn-bg); color: var(--text-main); border: 1px solid var(--border); padding: 7px 11px; border-radius: 6px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
    button.ctrl:disabled { opacity: 0.4; cursor: not-allowed; }
    button.ctrl.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    ol.steps { padding-left: 18px; margin: 0; display: flex; flex-direction: column; gap: 8px; }
    ol.steps li { font-size: 13px; line-height: 1.6; color: var(--text-muted); padding: 6px 8px; border-radius: 6px; border-left: 2px solid transparent; }
    ol.steps li.active-step { color: var(--text-body); background: rgba(59, 130, 246, 0.08); border-left-color: var(--accent); }
    @media (max-width: 768px) {
      #btn-mobile-toggle { display: inline-block; }
      #main { flex-direction: column; }
      #canvas-container { flex: 1; }
      #panel { max-width: 100%; flex: 1.1; border-left: none; border-top: 1px solid var(--border); }
      #panel.collapsed { display: none; }
    }
  </style>
</head>
<body>
<header>
  <a href="../index.html">← 目錄</a>
  <h1 id="header-title">載入中...</h1>
  <div class="header-actions">
    <button id="btn-theme" class="hdr-btn">淺色模式</button>
    <button id="btn-mobile-toggle" class="hdr-btn">隱藏解析</button>
  </div>
</header>

<div id="main">
  <div id="canvas-container">
    <div id="hint-badge">單指拖曳旋轉 · 觀察外積平行四邊形面積與垂足內積</div>
  </div>
  <div id="panel">
    <div class="card">
      <h2>題目敘述與雙解法幾何對照</h2>
      <p id="q-text"></p>
    </div>
    <div class="card">
      <h2>平滑運鏡與視角控制</h2>
      <div class="btn-group">
        <button id="btn-plane" class="ctrl primary">平滑切換「正對三點平面」</button>
        <button id="btn-reset" class="ctrl">重設預設 3D 視角</button>
      </div>
    </div>
    <div class="card">
      <h2>逐步拆解構造（Step-by-Step）</h2>
      <div class="stepper-bar">
        <span class="step-indicator" id="step-label">步驟 1 / 3：取線上定點 A 與方向向量 v</span>
        <div class="step-btns">
          <button id="btn-prev" class="ctrl" disabled>上一步</button>
          <button id="btn-next" class="ctrl primary">下一步</button>
        </div>
      </div>
      <ol id="steps-list" class="steps"></ol>
    </div>
  </div>
</div>

<script>
  const katexOpts = { delimiters: [{left: "$$", right: "$$", display: true}, {left: "$", right: "$", display: false}] };
  const urlParams = new URLSearchParams(window.location.search);
  const probId = urlParams.get('id') || 'vec-09';

  const toggleBtn = document.getElementById('btn-mobile-toggle');
  const panelEl = document.getElementById('panel');
  toggleBtn.onclick = () => {
    panelEl.classList.toggle('collapsed');
    toggleBtn.textContent = panelEl.classList.contains('collapsed') ? '顯示解析' : '隱藏解析';
    window.dispatchEvent(new Event('resize'));
  };

  fetch('../data/space-vector.json?v=' + Date.now()).then(r => r.json()).then(data => {
    const prob = data.problems.find(p => p.id === probId) || data.problems[data.problems.length - 1];
    if (typeof enforcePageLock === "function") enforcePageLock(prob.locked);
    document.getElementById('header-title').textContent = `${prob.num}. ${prob.title}`;
    document.getElementById('q-text').innerHTML = prob.questionLatex;
    const ol = document.getElementById('steps-list');
    prob.steps.forEach((s, idx) => {
      const li = document.createElement('li'); li.innerHTML = s;
      if (idx === 0) li.classList.add('active-step');
      ol.appendChild(li);
    });
    renderMathInElement(document.body, katexOpts);
  });

  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, container.clientWidth / container.clientHeight, 0.1, 100);
  const camDef = new THREE.Vector3(7.5, 5.5, 9.5), camPlane = new THREE.Vector3(0, 1.5, 10.5);
  camera.position.copy(camDef);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  let targetCamPos = null;
  function smoothMoveTo(posVec) { targetCamPos = posVec.clone(); }
  controls.addEventListener('start', () => { targetCamPos = null; });

  const th0 = getVisualTheme();
  const lineMat = new THREE.LineBasicMaterial({ color: th0.boxEdge });
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-4.5, 0, 0), new THREE.Vector3(4.5, 0, 0)]), lineMat));

  const A = new THREE.Vector3(-2.0, 0, 0), H = new THREE.Vector3(1.2, 0, 0), P = new THREE.Vector3(1.2, 2.8, 0), B = new THREE.Vector3(1.0, 0, 0);

  // Step 1
  const step1Group = new THREE.Group();
  const matA = new THREE.MeshBasicMaterial({ color: th0.secondary });
  const matP = new THREE.MeshBasicMaterial({ color: th0.primary });
  const dotA = new THREE.Mesh(new THREE.SphereGeometry(0.17, 16, 16), matA); dotA.position.copy(A);
  const dotP = new THREE.Mesh(new THREE.SphereGeometry(0.17, 16, 16), matP); dotP.position.copy(P);
  step1Group.add(dotA); step1Group.add(dotP);
  const arrowV = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), A, 3.0, th0.secondary, 0.35, 0.22);
  const arrowAP = new THREE.ArrowHelper(new THREE.Vector3().subVectors(P, A).normalize(), A, A.distanceTo(P), th0.plane, 0.35, 0.22);
  step1Group.add(arrowV); step1Group.add(arrowAP);
  scene.add(step1Group);

  // Step 2
  const step2Group = new THREE.Group(); step2Group.visible = false;
  const P_shift = new THREE.Vector3().addVectors(P, new THREE.Vector3(3.0, 0, 0));
  const paraMat = new THREE.MeshBasicMaterial({ color: th0.plane, side: THREE.DoubleSide, transparent: true, opacity: th0.planeOpacity });
  step2Group.add(new THREE.Mesh(new THREE.BufferGeometry().setFromPoints([A, B, P_shift, A, P_shift, P]), paraMat));
  scene.add(step2Group);

  // Step 3
  const step3Group = new THREE.Group(); step3Group.visible = false;
  const matH = new THREE.MeshBasicMaterial({ color: th0.highlight });
  const linePHMat = new THREE.LineBasicMaterial({ color: th0.highlight });
  step3Group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([P, H]), linePHMat));
  const dotH = new THREE.Mesh(new THREE.SphereGeometry(0.17, 16, 16), matH); dotH.position.copy(H);
  step3Group.add(dotH);
  scene.add(step3Group);

  const sprites = [
    makeThemeSprite('P (線外點)', 'textPrimary', new THREE.Vector3(1.2, 3.2, 0)),
    makeThemeSprite('A (線上定點)', 'textSecondary', new THREE.Vector3(-2.0, -0.45, 0)),
    makeThemeSprite('H (垂足)', 'textHighlight', new THREE.Vector3(1.2, -0.45, 0))
  ];
  sprites.forEach(sp => scene.add(sp));

  function sync3DColors() {
    const th = getVisualTheme();
    lineMat.color.setHex(th.boxEdge); matA.color.setHex(th.secondary); matP.color.setHex(th.primary);
    matH.color.setHex(th.highlight); linePHMat.color.setHex(th.highlight);
    paraMat.color.setHex(th.plane); paraMat.opacity = th.planeOpacity;
    arrowV.setColor(new THREE.Color(th.secondary)); arrowAP.setColor(new THREE.Color(th.plane));
    sprites.forEach(refreshSpriteTexture);
  }

  let currentStep = 1;
  const stepNames = ["步驟 1 / 3：取線上定點 A 建構 AP 與 v", "步驟 2 / 3：外積平行四邊形面積法求 d", "步驟 3 / 3：內積為零 (PH · v = 0) 求垂足 H"];
  function syncStepUI() {
    step1Group.visible = currentStep >= 1; step2Group.visible = currentStep >= 2; step3Group.visible = currentStep >= 3;
    document.getElementById('step-label').textContent = stepNames[currentStep - 1];
    document.getElementById('btn-prev').disabled = currentStep === 1;
    document.getElementById('btn-next').disabled = currentStep === 3;
    document.querySelectorAll('#steps-list li').forEach((li, idx) => li.classList.toggle('active-step', idx === currentStep - 1));
  }
  document.getElementById('btn-prev').onclick = () => { if (currentStep > 1) { currentStep--; syncStepUI(); } };
  document.getElementById('btn-next').onclick = () => { if (currentStep < 3) { currentStep++; syncStepUI(); } };

  let isPlane = false;
  document.getElementById('btn-plane').onclick = () => {
    isPlane = !isPlane; smoothMoveTo(isPlane ? camPlane : camDef);
    if (isPlane && currentStep < 2) { currentStep = 2; syncStepUI(); }
  };
  document.getElementById('btn-reset').onclick = () => { isPlane = false; smoothMoveTo(camDef); };
  document.getElementById('btn-theme').onclick = (e) => {
    const isL = document.body.classList.toggle('light-theme');
    e.target.textContent = isL ? '深色模式' : '淺色模式';
    sync3DColors();
  };

  function animate() {
    requestAnimationFrame(animate);
    if (targetCamPos) { camera.position.lerp(targetCamPos, 0.08); if (camera.position.distanceTo(targetCamPos) < 0.05) targetCamPos = null; }
    controls.update(); renderer.render(scene, camera);
  }
  animate();
  window.addEventListener('resize', () => {
    if (!container.clientWidth || !container.clientHeight) return;
    camera.aspect = container.clientWidth / container.clientHeight; camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });
</script>
</body>
</html>
