<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D 互動檢視｜點到平面的投影與對稱</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="../assets/auth.js"></script>
  <style>
    :root {
      --bg-base: #0b0f19; --bg-panel: #131a2a; --bg-card: #0b0f19;
      --border: #243049; --accent: #3b82f6; --text-main: #f1f5f9;
      --text-muted: #94a3b8; --text-body: #cbd5e1; --btn-bg: #1e293b;
    }
    body.light-theme {
      --bg-base: #f8fafc; --bg-panel: #ffffff; --bg-card: #f1f5f9;
      --border: #cbd5e1; --accent: #2563eb; --text-main: #0f172a;
      --text-muted: #475569; --text-body: #1e293b; --btn-bg: #e2e8f0;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; }
    body { margin: 0; background: var(--bg-base); color: var(--text-main); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    header { padding: 10px 16px; background: var(--bg-panel); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    header a { color: var(--text-muted); text-decoration: none; font-size: 13px; font-weight: 600; }
    header h1 { font-size: 14px; margin: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .header-actions { display: flex; gap: 6px; }
    .hdr-btn { background: var(--btn-bg); border: 1px solid var(--border); color: var(--text-main); padding: 5px 10px; border-radius: 5px; font-size: 12px; cursor: pointer; font-weight: 600; }
    #btn-mobile-toggle { display: none; }

    #main { display: flex; flex: 1; flex-direction: row; overflow: hidden; }
    #canvas-container { flex: 1.45; position: relative; cursor: grab; touch-action: none; }
    #hint-badge { position: absolute; bottom: 12px; left: 12px; background: var(--bg-panel); opacity: 0.88; padding: 5px 10px; border-radius: 5px; font-size: 11px; color: var(--text-muted); pointer-events: none; border: 1px solid var(--border); }

    #panel { flex: 1; max-width: 430px; background: var(--bg-panel); border-left: 1px solid var(--border); padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
    .card h2 { font-size: 12px; letter-spacing: 0.06em; margin: 0 0 8px 0; color: var(--accent); font-weight: 700; }
    .card p { font-size: 13.5px; line-height: 1.65; color: var(--text-body); margin: 4px 0; }
    .card strong { color: var(--text-main); }

    .stepper-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--bg-panel); padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); margin-bottom: 8px; }
    .step-indicator { font-size: 12.5px; font-weight: 700; color: var(--accent); }
    .step-btns { display: flex; gap: 6px; }
    button.ctrl { background: var(--btn-bg); color: var(--text-main); border: 1px solid var(--border); padding: 7px 11px; border-radius: 6px; font-size: 12.5px; font-weight: 600; cursor: pointer; }
    button.ctrl:disabled { opacity: 0.4; cursor: not-allowed; }
    button.ctrl.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    ol.steps { padding-left: 18px; margin: 0; display: flex; flex-direction: column; gap: 8px; }
    ol.steps li { font-size: 13px; line-height: 1.6; color: var(--text-muted); padding: 6px 8px; border-radius: 6px; border-left: 2px solid transparent; transition: 0.2s; }
    ol.steps li.active-step { color: var(--text-body); background: rgba(59, 130, 246, 0.08); border-left-color: var(--accent); }

    @media (max-width: 768px) {
      #btn-mobile-toggle { display: inline-block; }
      #main { flex-direction: column; }
      #canvas-container { flex: 1; }
      #panel { max-width: 100%; flex: 1.1; border-left: none; border-top: 1px solid var(--border); }
      #panel.collapsed { display: none; }
    }
  </style>
</head>
<body>
<header>
  <a href="../index.html">← 目錄</a>
  <h1 id="header-title">載入中...</h1>
  <div class="header-actions">
    <button id="btn-theme" class="hdr-btn">淺色模式</button>
    <button id="btn-mobile-toggle" class="hdr-btn">隱藏解析</button>
  </div>
</header>

<div id="main">
  <div id="canvas-container">
    <div id="hint-badge">單指拖曳旋轉 · 觀察法向量參數式構造</div>
  </div>
  <div id="panel">
    <div class="card">
      <h2>題目敘述與核心幾何</h2>
      <p id="q-text"></p>
    </div>

    <div class="card">
      <h2>平滑運鏡與視角控制</h2>
      <div class="btn-group">
        <button id="btn-side" class="ctrl primary">平滑切換「側視平面」視角</button>
        <button id="btn-reset" class="ctrl">重設預設 3D 視角</button>
      </div>
    </div>

    <div class="card">
      <h2>逐步拆解構造（Step-by-Step）</h2>
      <div class="stepper-bar">
        <span class="step-indicator" id="step-label">步驟 1 / 3：點 P 與平面法向量 n</span>
        <div class="step-btns">
          <button id="btn-prev" class="ctrl" disabled>上一步</button>
          <button id="btn-next" class="ctrl primary">下一步</button>
        </div>
      </div>
      <ol id="steps-list" class="steps"></ol>
    </div>
  </div>
</div>

<script>
  const katexOpts = { delimiters: [{left: "$$", right: "$$", display: true}, {left: "$", right: "$", display: false}] };
  const urlParams = new URLSearchParams(window.location.search);
  const probId = urlParams.get('id') || 'vec-05';

  const toggleBtn = document.getElementById('btn-mobile-toggle');
  const panelEl = document.getElementById('panel');
  toggleBtn.onclick = () => {
    panelEl.classList.toggle('collapsed');
    toggleBtn.textContent = panelEl.classList.contains('collapsed') ? '顯示解析' : '隱藏解析';
    window.dispatchEvent(new Event('resize'));
  };

  fetch('../data/space-vector.json?v=' + Date.now()).then(r => r.json()).then(data => {
    const prob = data.problems.find(p => p.id === probId) || data.problems[data.problems.length - 1];
    if (typeof enforcePageLock === "function") enforcePageLock(prob.locked);
    document.getElementById('header-title').textContent = `${prob.num}. ${prob.title}`;
    document.getElementById('q-text').innerHTML = prob.questionLatex;
    const ol = document.getElementById('steps-list');
    prob.steps.forEach((s, idx) => {
      const li = document.createElement('li');
      li.innerHTML = s;
      if (idx === 0) li.classList.add('active-step');
      ol.appendChild(li);
    });
    renderMathInElement(document.body, katexOpts);
  });

  // Three.js 場景設定
  const container = document.getElementById('canvas-container');
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(42, container.clientWidth / container.clientHeight, 0.1, 100);
  const camDef = new THREE.Vector3(8.5, 6.0, 9.5);
  const camSide = new THREE.Vector3(0, 0.5, 11.5);
  camera.position.copy(camDef);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;

  let targetCamPos = null;
  function smoothMoveTo(posVec) { targetCamPos = posVec.clone(); }
  controls.addEventListener('start', () => { targetCamPos = null; });

  // 平面 E (位於 y = 0 水平面，方便側視一目了然)
  const planeGeo = new THREE.PlaneGeometry(8, 8);
  planeGeo.rotateX(-Math.PI / 2);
  scene.add(new THREE.Mesh(planeGeo, new THREE.MeshBasicMaterial({ color: 0x3b82f6, side: THREE.DoubleSide, transparent: true, opacity: 0.28 })));
  scene.add(new THREE.LineSegments(new THREE.EdgesGeometry(planeGeo), new THREE.LineBasicMaterial({ color: 0x60a5fa })));

  const P = new THREE.Vector3(0.5, 3.2, 0.5);
  const H = new THREE.Vector3(0.5, 0, 0.5);
  const Psym = new THREE.Vector3(0.5, -3.2, 0.5);
  const P0 = new THREE.Vector3(-2.5, 0, -1.5); // 平面上已知點

  // Step 1: 點 P 與法向量箭頭 n
  const step1Group = new THREE.Group();
  const dotP = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 16), new THREE.MeshBasicMaterial({ color: 0xf97316 }));
  dotP.position.copy(P); step1Group.add(dotP);
  step1Group.add(new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(-2.5, 0, 1.5), 2.5, 0x3b82f6, 0.35, 0.22));
  scene.add(step1Group);

  // Step 2: 過 P 沿法向量方向射出垂線至投影點 H + 顯示 P0P 向量斜邊
  const step2Group = new THREE.Group();
  step2Group.visible = false;
  step2Group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([P, H]), new THREE.LineBasicMaterial({ color: 0xfacc15 })));
  const dotH = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 16), new THREE.MeshBasicMaterial({ color: 0xfacc15 }));
  dotH.position.copy(H); step2Group.add(dotH);

  // 輔助直角三角形 P0-H-P
  const dashMat = new THREE.LineDashedMaterial({ color: 0x94a3b8, dashSize: 0.2, gapSize: 0.12 });
  [[P0, P], [P0, H]].forEach(([a, b]) => {
    const l = new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, b]), dashMat);
    l.computeLineDistances(); step2Group.add(l);
  });
  const dotP0 = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 16), new THREE.MeshBasicMaterial({ color: 0x94a3b8 }));
  dotP0.position.copy(P0); step2Group.add(dotP0);
  scene.add(step2Group);

  // Step 3: 向下延伸等距至對稱點 P'
  const step3Group = new THREE.Group();
  step3Group.visible = false;
  const symLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints([H, Psym]), new THREE.LineDashedMaterial({ color: 0x10b981, dashSize: 0.2, gapSize: 0.12 }));
  symLine.computeLineDistances(); step3Group.add(symLine);
  const dotPsym = new THREE.Mesh(new THREE.SphereGeometry(0.16, 16, 16), new THREE.MeshBasicMaterial({ color: 0x10b981 }));
  dotPsym.position.copy(Psym); step3Group.add(dotPsym);
  scene.add(step3Group);

  // 標籤系統
  const labelSprites = [];
  function buildLabels(isLight) {
    labelSprites.forEach(sp => scene.remove(sp));
    labelSprites.length = 0;
    const items = [
      { txt: 'P', pos: P, col: '#fb923c', off: [0.4, 0.2, 0] },
      { txt: 'H (投影點)', pos: H, col: '#eab308', off: [1.1, 0.25, 0] },
      { txt: "P' (對稱點)", pos: Psym, col: '#10b981', off: [1.1, -0.2, 0] },
      { txt: 'P0', pos: P0, col: isLight ? '#475569' : '#94a3b8', off: [-0.4, 0.25, 0] },
      { txt: 'n', pos: new THREE.Vector3(-2.5, 2.7, 1.5), col: '#3b82f6', off: [0, 0.2, 0] }
    ];
    items.forEach(it => {
      const c = document.createElement('canvas'); c.width = 256; c.height = 64;
      const ctx = c.getContext('2d'); ctx.fillStyle = it.col; ctx.font = '700 32px -apple-system, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(it.txt, 128, 32);
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true }));
      sp.position.copy(it.pos).add(new THREE.Vector3(...it.off));
      sp.scale.set(2.2, 0.55, 1);
      scene.add(sp);
      labelSprites.push(sp);
    });
  }
  buildLabels(false);

  let currentStep = 1;
  const stepNames = [
    "步驟 1 / 3：確立過 P 點之法線方向",
    "步驟 2 / 3：參數式代入平面求投影點 H",
    "步驟 3 / 3：利用中點公式倍增求對稱點 P'"
  ];
  function syncStepUI() {
    step1Group.visible = currentStep >= 1;
    step2Group.visible = currentStep >= 2;
    step3Group.visible = currentStep >= 3;
    document.getElementById('step-label').textContent = stepNames[currentStep - 1];
    document.getElementById('btn-prev').disabled = currentStep === 1;
    document.getElementById('btn-next').disabled = currentStep === 3;
    document.querySelectorAll('#steps-list li').forEach((li, idx) => li.classList.toggle('active-step', idx === currentStep - 1));
  }
  document.getElementById('btn-prev').onclick = () => { if (currentStep > 1) { currentStep--; syncStepUI(); } };
  document.getElementById('btn-next').onclick = () => { if (currentStep < 3) { currentStep++; syncStepUI(); } };

  let isSide = false;
  document.getElementById('btn-side').onclick = () => {
    isSide = !isSide;
    smoothMoveTo(isSide ? camSide : camDef);
    if (isSide && currentStep < 3) { currentStep = 3; syncStepUI(); }
  };
  document.getElementById('btn-reset').onclick = () => { isSide = false; smoothMoveTo(camDef); };

  let isLight = false;
  document.getElementById('btn-theme').onclick = (e) => {
    isLight = !isLight;
    document.body.classList.toggle('light-theme', isLight);
    e.target.textContent = isLight ? '深色模式' : '淺色模式';
    buildLabels(isLight);
  };

  function animate() {
    requestAnimationFrame(animate);
    if (targetCamPos) {
      camera.position.lerp(targetCamPos, 0.08);
      if (camera.position.distanceTo(targetCamPos) < 0.05) targetCamPos = null;
    }
    controls.update();
    renderer.render(scene, camera);
  }
  animate();
  window.addEventListener('resize', () => {
    if (!container.clientWidth || !container.clientHeight) return;
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
  });
</script>
</body>
</html>
