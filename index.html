<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>高中數學 3D 空間視覺化圖庫</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <style>
    :root {
      --bg-base: #0b0f19;
      --bg-card: #131a2a;
      --bg-hover: #192236;
      --border: #243049;
      --accent: #3b82f6;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Segoe UI", sans-serif; }
    body { margin: 0; background: var(--bg-base); color: var(--text-main); padding: 32px 20px; line-height: 1.6; }
    .container { max-width: 900px; margin: 0 auto; }
    header { margin-bottom: 28px; border-bottom: 1px solid var(--border); padding-bottom: 18px; }
    .eyebrow { font-size: 12px; letter-spacing: 0.08em; color: var(--accent); font-weight: 700; text-transform: uppercase; margin-bottom: 6px; }
    h1 { font-size: 24px; font-weight: 700; margin: 0 0 6px 0; letter-spacing: -0.01em; }
    p.sub { color: var(--text-muted); font-size: 14px; margin: 0; }

    /* 課綱單元大框架導覽列 */
    .unit-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
    .tab { padding: 7px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-muted); }
    .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .tab.disabled { opacity: 0.45; cursor: not-allowed; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; transition: border-color 0.2s, background 0.2s; }
    .card:hover { border-color: var(--accent); background: var(--bg-hover); }
    .meta { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .num { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--accent); font-weight: 700; background: rgba(59, 130, 246, 0.12); padding: 2px 8px; border-radius: 4px; }
    .tag { font-size: 12px; color: var(--text-muted); font-weight: 500; }
    .card h2 { font-size: 17px; margin: 0 0 10px 0; color: var(--text-main); font-weight: 600; }
    .card p { font-size: 13.5px; color: var(--text-muted); margin: 0 0 20px 0; }
    .btn { display: inline-flex; align-items: center; justify-content: center; background: #1e293b; color: var(--text-main); border: 1px solid var(--border); text-decoration: none; padding: 9px 14px; border-radius: 6px; font-weight: 600; font-size: 13px; transition: 0.15s; }
    .card:hover .btn { background: var(--accent); border-color: var(--accent); color: #fff; }
    @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="eyebrow" id="unit-code">108 課綱視覺化模型庫</div>
      <h1 id="unit-title">載入中...</h1>
      <p class="sub" id="unit-sub"></p>
    </header>

    <!-- 課綱大框架分類導覽（未來擴充直接啟用對應分頁） -->
    <nav class="unit-tabs">
      <div class="tab active">高二下數A｜空間向量與平面（已上線）</div>
      <div class="tab disabled">高二上數A｜三角函數波形（規劃中）</div>
      <div class="tab disabled">高三選修數甲｜圓錐曲線截痕（規劃中）</div>
    </nav>

    <div class="grid" id="problem-list"></div>
  </div>

  <script>
    fetch('data/space-vector.json')
      .then(res => res.json())
      .then(data => {
        document.getElementById('unit-code').textContent = data.unitCode + ' · 互動幾何模組';
        document.getElementById('unit-title').textContent = data.unitTitle;
        document.getElementById('unit-sub').textContent = data.subtitle;
        const list = document.getElementById('problem-list');
        data.problems.forEach(p => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div>
              <div class="meta">
                <span class="num">${p.num}</span>
                <span class="tag">${p.tag}</span>
              </div>
              <h2>${p.title}</h2>
              <p>${p.questionLatex}</p>
            </div>
            <a class="btn" href="${p.template}?id=${p.id}">進入 3D 互動檢視</a>
          `;
          list.appendChild(card);
        });
        renderMathInElement(document.body, {
          delimiters: [{left: "$$", right: "$$", display: true}, {left: "$", right: "$", display: false}]
        });
      });
  </script>
</body>
</html>
