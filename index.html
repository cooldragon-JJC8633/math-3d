<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>高中數學 3D 空間視覺化圖庫</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script src="assets/auth.js"></script>
  <style>
    :root { --bg-base: #0b0f19; --bg-card: #131a2a; --bg-hover: #192236; --border: #243049; --accent: #3b82f6; --text-main: #f1f5f9; --text-muted: #94a3b8; }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; }
    body { margin: 0; background: var(--bg-base); color: var(--text-main); padding: 32px 20px; line-height: 1.6; }
    .container { max-width: 900px; margin: 0 auto; }
    header { margin-bottom: 28px; border-bottom: 1px solid var(--border); padding-bottom: 18px; display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 12px; }
    .eyebrow { font-size: 12px; letter-spacing: 0.08em; color: var(--accent); font-weight: 700; margin-bottom: 6px; }
    h1 { font-size: 24px; font-weight: 700; margin: 0 0 6px 0; }
    p.sub { color: var(--text-muted); font-size: 14px; margin: 0; }
    .status-pill { font-size: 12px; padding: 5px 12px; border-radius: 99px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-muted); }
    .status-pill.unlocked { border-color: #10b981; color: #34d399; background: rgba(16, 185, 129, 0.1); }
    .unit-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
    .tab { padding: 7px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-muted); }
    .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .tab.disabled { opacity: 0.45; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
    .card:hover { border-color: var(--accent); background: var(--bg-hover); }
    .meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .meta-left { display: flex; align-items: center; gap: 8px; }
    .num { font-family: monospace; font-size: 12px; color: var(--accent); font-weight: 700; background: rgba(59, 130, 246, 0.12); padding: 2px 8px; border-radius: 4px; }
    .tag { font-size: 12px; color: var(--text-muted); }
    .badge-free { font-size: 11px; color: #34d399; background: rgba(16, 185, 129, 0.12); padding: 2px 8px; border-radius: 4px; font-weight: 600; }
    .badge-lock { font-size: 11px; color: #facc15; background: rgba(250, 204, 21, 0.12); padding: 2px 8px; border-radius: 4px; font-weight: 600; }
    .card h2 { font-size: 17px; margin: 0 0 10px 0; font-weight: 600; }
    .card p { font-size: 13.5px; color: var(--text-muted); margin: 0 0 20px 0; }
    .btn { display: inline-flex; justify-content: center; background: #1e293b; color: var(--text-main); border: 1px solid var(--border); text-decoration: none; padding: 9px 14px; border-radius: 6px; font-weight: 600; font-size: 13px; }
    .card:hover .btn { background: var(--accent); border-color: var(--accent); color: #fff; }
    @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <div class="eyebrow" id="unit-code">108 課綱視覺化模型庫</div>
        <h1 id="unit-title">載入中...</h1>
        <p class="sub" id="unit-sub"></p>
      </div>
      <div id="auth-status" class="status-pill">目前狀態：免費體驗版</div>
    </header>
    <nav class="unit-tabs">
      <div class="tab active">高二下數A｜空間向量與平面（已上線）</div>
      <div class="tab disabled">高二上數A｜三角函數波形（規劃中）</div>
      <div class="tab disabled">高三選修數甲｜圓錐曲線截痕（規劃中）</div>
    </nav>
    <div class="grid" id="problem-list"></div>
  </div>
  <script>
    const unlocked = typeof isUnlocked === "function" && isUnlocked();
    if (unlocked) {
      const pill = document.getElementById("auth-status");
      pill.textContent = "目前狀態：完整版已解鎖";
      pill.classList.add("unlocked");
    }

    fetch('data/space-vector.json?v=' + Date.now())
      .then(res => res.json())
      .then(data => {
        document.getElementById('unit-code').textContent = (data.unitCode || 'G11-S2') + ' · 互動幾何模組';
        document.getElementById('unit-title').textContent = data.unitTitle;
        document.getElementById('unit-sub').textContent = data.subtitle;
        const list = document.getElementById('problem-list');
        data.problems.forEach(p => {
          const needLock = p.locked && !unlocked;
          const badgeHtml = !p.locked
            ? `<span class="badge-free">免費體驗</span>`
            : (unlocked ? `<span class="badge-free">已解鎖</span>` : `<span class="badge-lock">完整版專享</span>`);
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div>
              <div class="meta">
                <div class="meta-left"><span class="num">${p.num}</span><span class="tag">${p.tag}</span></div>
                ${badgeHtml}
              </div>
              <h2>${p.title}</h2>
              <p>${p.questionLatex}</p>
            </div>
            <a class="btn" href="${p.template}?id=${p.id}">${needLock ? '輸入通行碼檢視 →' : '進入 3D 互動檢視'}</a>
          `;
          list.appendChild(card);
        });
        renderMathInElement(document.body, { delimiters: [{left: "$$", right: "$$", display: true}, {left: "$", right: "$", display: false}] });
      });
  </script>
</body>
</html>
