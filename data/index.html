<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>高中數學 3D 互動圖解室</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; }
    body { margin: 0; background: #0f172a; color: #f8fafc; padding: 24px 16px; }
    .container { max-width: 820px; margin: 0 auto; }
    header { margin-bottom: 24px; border-bottom: 1px solid #334155; padding-bottom: 16px; }
    h1 { font-size: 22px; color: #38bdf8; margin: 0 0 8px 0; }
    p.sub { color: #94a3b8; font-size: 14px; margin: 0; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; transition: 0.2s; }
    .card:hover { border-color: #38bdf8; transform: translateY(-2px); }
    .tag { display: inline-block; background: rgba(56,189,248,0.15); color: #38bdf8; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 99px; margin-bottom: 10px; width: fit-content; }
    .card h2 { font-size: 17px; margin: 0 0 10px 0; color: #f8fafc; }
    .card p { font-size: 13.5px; color: #cbd5e1; line-height: 1.6; margin: 0 0 16px 0; }
    .btn { display: block; text-align: center; background: #2563eb; color: white; text-decoration: none; padding: 10px; border-radius: 8px; font-weight: 600; font-size: 14px; }
    .btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1 id="unit-title">載入中...</h1>
      <p class="sub" id="unit-sub"></p>
    </header>
    <div class="grid" id="problem-list"></div>
  </div>

  <script>
    fetch('data/space-vector.json')
      .then(res => res.json())
      .then(data => {
        document.getElementById('unit-title').textContent = data.unitTitle;
        document.getElementById('unit-sub').textContent = data.subtitle;
        const list = document.getElementById('problem-list');
        data.problems.forEach(p => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div>
              <span class="tag">${p.tag}</span>
              <h2>${p.title}</h2>
              <p>${p.questionLatex}</p>
            </div>
            <a class="btn" href="${p.template}?id=${p.id}">開啟 3D 互動圖解 →</a>
          `;
          list.appendChild(card);
        });
        renderMathInElement(document.body, { delimiters: [{left: "$$", right: "$$", display: true}, {left: "$", right: "$", display: false}] });
      });
  </script>
</body>
</html>
